<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Shield - Semantic Trigger Filter</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: rgba(22, 30, 46, 0.85);
      --border: rgba(255, 255, 255, 0.12);
      --primary: #ef4444;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 320px;
      background: var(--bg);
      background-image: radial-gradient(at 0% 0%, rgba(239, 68, 68, 0.15) 0px, transparent 50%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      padding: 16px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }

    .header-title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.2px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 12px;
    }

    label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
    }

    #triggerInput {
      width: 100%;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      color: #ffffff;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    #triggerInput:focus {
      border-color: #ef4444;
      box-shadow: 0 0 0 2px rgba(239, 68, 68, 0.25);
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    button {
      flex: 1;
      background: linear-gradient(135deg, #ef4444, #dc2626);
      border: none;
      border-radius: 8px;
      color: #ffffff;
      font-size: 13px;
      font-weight: 600;
      padding: 9px 16px;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(239, 68, 68, 0.3);
      transition: opacity 0.2s, transform 0.1s;
    }

    button:hover {
      opacity: 0.92;
      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(0);
    }

    #statusMessage {
      font-size: 11.5px;
      color: #10b981;
      min-height: 18px;
      margin-top: 8px;
      display: block;
      text-align: center;
      font-weight: 500;
    }

    .footer {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: center;
    }

    .demo-link {
      font-size: 11px;
      color: #60a5fa;
      text-decoration: none;
      font-weight: 500;
    }

    .demo-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="header">
    <span style="font-size: 18px;">🛡️</span>
    <span class="header-title">AI Shield - Trigger Filter</span>
  </div>

  <div class="form-group">
    <label for="triggerInput">Semantic Trigger Word / Phrase:</label>
    <input type="text" id="triggerInput" placeholder="e.g. spiders, violence, abuse...">
  </div>

  <div class="actions">
    <button id="saveButton" type="button">Save</button>
  </div>

  <span id="statusMessage"></span>

  <div class="footer">
    <a href="demo.html" target="_blank" class="demo-link" id="btnOpenDemo">🛡️ Open Live Test Demo</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
